name: Deploy to Prod

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm (via Corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy dist to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # VPS IP is used directly: mb-finder.org is behind Cloudflare, which blocks SSH (port 22).
          VPS_HOST: 45.136.16.73
          DOCROOT: /var/www/html/home/mb-finder_frontend
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          # Back up the current live docroot before replacing it (for quick rollback).
          $SSH "root@${VPS_HOST}" \
            "ts=\$(date +%Y%m%d-%H%M%S); \
             bdir=${DOCROOT}_backups/\$ts; \
             mkdir -p \"\$bdir\" && cp -a ${DOCROOT}/. \"\$bdir/\" && \
             echo \"Backup created at \$bdir\""

          # Sync the freshly built site into the docroot (removes stale old asset bundles).
          rsync -avz --delete \
            -e "$SSH" \
            dist/ "root@${VPS_HOST}:${DOCROOT}/"

          echo "Deployed $(git rev-parse --short HEAD) to ${VPS_HOST}:${DOCROOT}"
